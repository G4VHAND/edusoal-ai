name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, gd, zip, bcmath
          coverage: none

      - name: Cache Composer packages
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies Node
        run: npm ci

      - name: Build frontend assets
        # WAJIB — /public/build di-gitignore, jadi CI harus build sendiri.
        # Tanpa ini, semua test yang render halaman penuh (pakai @vite di
        # layout) akan gagal karena manifest.json tidak ditemukan.
        run: npm run build

      - name: Siapkan file .env
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Pastikan storage & cache bisa ditulis
        run: chmod -R 775 storage bootstrap/cache

      - name: Jalankan test suite
        run: php artisan test --stop-on-failure
