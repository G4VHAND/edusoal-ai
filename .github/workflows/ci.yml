name: CI — EduSoal AI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  # composer.lock sudah pakai Symfony v8.1 yang mewajibkan PHP >= 8.4.1,
  # jadi PHP 8.3 TIDAK bisa dipakai lagi untuk composer install di CI ini
  # (lihat run yang gagal 4 Juli 2026). Matrix disesuaikan ke 8.4 & 8.5
  # (8.5 = versi yang dipakai di environment development).
  PHP_EXTENSIONS: pdo, pdo_sqlite, mbstring, xml, dom, fileinfo, bcmath, gd, zip

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Cache Composer packages
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Siapkan folder storage & cache
        # WAJIB sebelum composer install — composer punya post-install
        # script (package:discover) yang butuh bootstrap/cache sudah ada
        # dan writable. Tanpa ini, composer install sendiri akan gagal.
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          chmod -R 775 storage bootstrap/cache

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        # WAJIB — /public/build di-gitignore jadi tidak ikut ter-commit.
        # Layout (app.blade.php, guest.blade.php) pakai @vite(...), jadi
        # tanpa build ini hampir semua Feature test yang render halaman
        # akan gagal dengan error "Unable to locate file in Vite manifest".
        run: npm run build

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run Unit Tests
        run: php artisan test --testsuite=Unit --stop-on-failure

      - name: Run Feature Tests
        run: php artisan test --testsuite=Feature --stop-on-failure

  lint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Siapkan folder storage & cache
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          chmod -R 775 storage bootstrap/cache

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Laravel Pint
        run: ./vendor/bin/pint --test

  security:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Siapkan folder storage & cache
        run: |
          mkdir -p bootstrap/cache
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          chmod -R 775 storage bootstrap/cache

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check for known vulnerabilities
        run: composer audit
